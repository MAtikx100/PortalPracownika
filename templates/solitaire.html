{% extends "index.html" %}
{% load static %}

{% block head %}
    <title>Solitaire</title>
    <link rel="stylesheet" href="{% static 'solitaire/style.css' %}">
{% endblock %}

{% block content %}
    <h1>Solitaire</h1>
    <div id="game-board">
        <div class="top-section">
            <div class="stock-talon-container">
                <div class="stock-pile pile"></div>
                <div class="talon-pile pile"></div>
            </div>
            <div class="foundations-container">
                <div class="foundation-pile pile" data-pile-index="0"></div>
                <div class="foundation-pile pile" data-pile-index="1"></div>
                <div class="foundation-pile pile" data-pile-index="2"></div>
                <div class="foundation-pile pile" data-pile-index="3"></div>
            </div>
        </div>
        <div class="tableau-container">
            <div class="tableau-pile pile" data-pile-index="0"></div>
            <div class="tableau-pile pile" data-pile-index="1"></div>
            <div class="tableau-pile pile" data-pile-index="2"></div>
            <div class="tableau-pile pile" data-pile-index="3"></div>
            <div class="tableau-pile pile" data-pile-index="4"></div>
            <div class="tableau-pile pile" data-pile-index="5"></div>
            <div class="tableau-pile pile" data-pile-index="6"></div>
        </div>
        <button id="new-game-button">New Game</button>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{% static 'solitaire/solitaire.js' %}"></script>
{% endblock %}
