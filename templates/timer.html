<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work Timer</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        #display { font-size: 3em; margin: 20px; }
        button { font-size: 1em; padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h2>Work Timer</h2>
    <div id="display">00:00:00</div>
    <button id="startStopBtn">Start</button>
    <button id="resetBtn">Reset</button>

    <script>
        let timer;
        let isRunning = false;
        let seconds = 0;

        const display = document.getElementById('display');
        const startStopBtn = document.getElementById('startStopBtn');
        const resetBtn = document.getElementById('resetBtn');

        function formatTime(sec) {
            const hours = Math.floor(sec / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const seconds = (sec % 60).toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(seconds);
        }

        function startStop() {
            if (isRunning) {
                clearInterval(timer);
                startStopBtn.textContent = 'Start';
            } else {
                timer = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
                startStopBtn.textContent = 'Stop';
            }
            isRunning = !isRunning;
        }

        function reset() {
            clearInterval(timer);
            isRunning = false;
            seconds = 0;
            updateDisplay();
            startStopBtn.textContent = 'Start';
        }

        startStopBtn.addEventListener('click', startStop);
        resetBtn.addEventListener('click', reset);
    </script>
</body>
</html>
