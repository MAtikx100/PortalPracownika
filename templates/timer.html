<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Work Timer</title>
    <style>
        body { font-family: sans-serif; text-align: center; }
        #display { font-size: 3em; margin: 20px; }
        button { font-size: 1em; padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h2>Work Timer</h2>
    <div id="display">00:00:00</div>
    <button id="startStopBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="saveBtn">Save</button>
    <ul id="savedTimes"></ul>

    <script>
        let timer;
        let isRunning = false;
        let seconds = 0;

        const display = document.getElementById('display');
        const startStopBtn = document.getElementById('startStopBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const savedTimes = document.getElementById('savedTimes');

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function formatTime(sec) {
            const hours = Math.floor(sec / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
            const secondsValue = (sec % 60).toString().padStart(2, '0');
            return `${hours}:${minutes}:${secondsValue}`;
        }

        function updateDisplay() {
            display.textContent = formatTime(seconds);
        }

        function startStop() {
            if (isRunning) {
                clearInterval(timer);
                startStopBtn.textContent = 'Start';
            } else {
                timer = setInterval(() => {
                    seconds++;
                    updateDisplay();
                }, 1000);
                startStopBtn.textContent = 'Stop';
            }
            isRunning = !isRunning;
        }

        function reset() {
            clearInterval(timer);
            isRunning = false;
            seconds = 0;
            updateDisplay();
            startStopBtn.textContent = 'Start';
        }

        function saveTime() {
            const time = formatTime(seconds);
            fetch('/save_time/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken'),
                },
                body: JSON.stringify({ time: time }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok') {
                    const timeItem = document.createElement('li');
                    timeItem.textContent = time;
                    savedTimes.appendChild(timeItem);
                }
            });
        }

        function loadSavedTimes() {
            fetch('/get_times/')
            .then(response => response.json())
            .then(data => {
                savedTimes.innerHTML = '';
                data.forEach(time => {
                    const timeItem = document.createElement('li');
                    timeItem.textContent = time;
                    savedTimes.appendChild(timeItem);
                });
            });
        }

        startStopBtn.addEventListener('click', startStop);
        resetBtn.addEventListener('click', reset);
        saveBtn.addEventListener('click', saveTime);

        window.onload = loadSavedTimes;
    </script>
</body>
</html>
